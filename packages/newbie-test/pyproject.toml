# ============================================
# newbie-test: Alias package for newb
# https://github.com/ywatanabe1989/newb
# ============================================
# This is a redirect/alias package. Install either:
#   pip install newb
#   pip install newbie-test
# Both install the same library.
# ============================================

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "newbie-test"
version = "0.0.1"
description = "Alias for newb — agentic testing for Python packages."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [{name = "Yusuke Watanabe", email = "ywata1989@gmail.com"}]
dependencies = ["newb>=0.0.1"]
keywords = ["newb", "newbie-test", "agentic-test", "skill-verify", "documentation-testing", "ai-agent", "llm"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/newb"

[tool.setuptools]
packages = []
