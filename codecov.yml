codecov:
  require_ci_to_pass: false
  # Treat develop as the de-facto default branch — main is a stable
  # release mirror that only fast-forwards from develop, so develop
  # is where coverage uploads land. Makes the unbranched
  # /graph/badge.svg endpoint follow develop's value.
  branch: develop

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

ignore:
  - "src/newb/_skills/**"
  - "src/newb/_cli/_completion.py"
  - "tests/**"
  - "examples/**"

comment: false
