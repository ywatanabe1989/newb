[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "newb"
version = "0.26.2"
description = "A fresh AI agent tries to use your package — pytest-style. If it succeeds, your docs work."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [{name = "Yusuke Watanabe", email = "ywata1989@gmail.com"}]
dependencies = ["click>=8.0", "claude-agent-sdk>=0.1.0"]
keywords = ["agentic-test", "newbie-test", "skill-verify", "documentation-testing", "ai-agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
mcp  = ["fastmcp>=2.0"]
# Battle-tested OSS prompt-injection detector from Protect AI. Optional
# because the model download is ~700MB; users opt in for stricter
# pre-flight scanning beyond the in-template self-check question.
security = [
    "transformers>=4.40",
    "torch>=2.0",
    "sentencepiece>=0.1.99",
]
all  = [
    "PyYAML>=6.0",
    "fastmcp>=2.0",
    "transformers>=4.40",
    "torch>=2.0",
    "sentencepiece>=0.1.99",
]
# PS210 — `[dev]` includes every dependency that the test suite imports
# unguarded so a fresh `pip install -e .[dev]` runs the full suite.
# fastmcp is here because tests/newb/test__mcp_inject.py imports it
# without a `pytest.importorskip` guard.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout",
    "PyYAML>=6.0",
    "fastmcp>=2.0",
    "scitex-dev>=0.11.5",
]

[project.scripts]
newb = "newb._cli:cli_entrypoint"
scitex-newb = "newb._cli:cli_entrypoint"   # SciTeX-namespaced alias

[project.urls]
Homepage = "https://github.com/ywatanabe1989/newb"
Repository = "https://github.com/ywatanabe1989/newb"

[tool.setuptools.packages.find]
where = ["src"]

[tool.scitex-linter]
# `containers/runner.py` runs INSIDE the docker/apptainer container; it
# is library-style (no scitex deps), not a SciTeX session script.
library_dirs = ["src", "tests", "containers"]
