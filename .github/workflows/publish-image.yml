name: Publish newb-runner image

# Builds containers/Dockerfile and pushes to
#   ghcr.io/ywatanabe1989/newb-runner:latest
#   ghcr.io/ywatanabe1989/newb-runner:vX.Y.Z   (on v* tags)
#
# Trigger: explicit (workflow_dispatch) or v* tag push.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.8.0). "latest" only on workflow_dispatch.'
        required: true
        type: string
        default: latest
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Classic PAT with packages:write — the auto-generated
          # GITHUB_TOKEN gets 403 on the existing newb-runner package
          # because the package's "Manage Actions access" is opt-in
          # per repo. Fall back to GHCR_PAT first; the bot token still
          # works for newly-created packages.
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: v0.8.0 -> 0.8.0  (also tag :latest)
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "tags=ghcr.io/ywatanabe1989/newb-runner:${TAG},ghcr.io/ywatanabe1989/newb-runner:latest" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch
            INPUT="${{ github.event.inputs.version }}"
            CLEAN="${INPUT#v}"
            if [ "$INPUT" = "latest" ]; then
              echo "tags=ghcr.io/ywatanabe1989/newb-runner:latest" >> "$GITHUB_OUTPUT"
            else
              echo "tags=ghcr.io/ywatanabe1989/newb-runner:${CLEAN}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: containers
          push: true
          tags: ${{ steps.tag.outputs.tags }}
