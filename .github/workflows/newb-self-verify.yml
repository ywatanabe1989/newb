name: Newb

# Dogfood verification — `newb .` against newb. If this is red, newb's
# own docs are not ready to ship; if green, the verification path works
# end-to-end on the simplest target there is (newb knows itself).
#
# Manual trigger only for now — once stable, add a daily schedule.

on:
  workflow_dispatch:

jobs:
  self-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Runner image is public on ghcr.io as of 2026-05-03 — anonymous
      # `docker pull` works, no login step needed.

      - name: Install newb (this checkout, not PyPI)
        run: |
          pip install -e .
          newb --version

      - name: Resolve container image (must match this checkout's version)
        id: img
        run: |
          python -c "from newb._container_runner import _default_image; print('image=' + _default_image())" >> "$GITHUB_OUTPUT"

      - name: Provision Anthropic auth (credentials.json or bare key)
        # Anthropic rejects `sk-ant-oat01-…` OAuth tokens passed as a
        # bare ANTHROPIC_API_KEY. The container runner bind-mounts
        # ~/.claude/.credentials.json into the container when it
        # exists on the host — so we materialise it here from a
        # secret. CLAUDE_CREDENTIALS_JSON should hold the *full*
        # credentials.json content (refresh_token, expiresAt, …) as
        # produced by `claude /login` locally. If the secret is
        # missing, fall back to the bare-key path (works for real
        # `sk-ant-api*` keys).
        env:
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
        run: |
          if [ -n "${CLAUDE_CREDENTIALS_JSON}" ]; then
            mkdir -p "${HOME}/.claude"
            printf '%s' "${CLAUDE_CREDENTIALS_JSON}" > "${HOME}/.claude/.credentials.json"
            chmod 600 "${HOME}/.claude/.credentials.json"
            echo "auth: bind-mounted credentials.json (OAuth flat-rate)"
          else
            echo "auth: NEWB_ANTHROPIC_API_KEY only (no credentials.json secret set)"
          fi

      - name: Run newb against newb
        env:
          NEWB_ANTHROPIC_API_KEY: ${{ secrets.NEWB_ANTHROPIC_API_KEY }}
          # Resource caps — auditor flagged that cap-drop=ALL handles
          # capabilities but unconstrained memory/pids opens a DoS lane
          # if an attacker hijacks the agent. Generous-but-bounded is
          # the right shape for a docs verifier: pip wheel-building is
          # the peak workload, ~1-2GB transient.
          NEWB_HARDEN_MEMORY: 4g
          NEWB_HARDEN_PIDS_LIMIT: 512
          NEWB_HARDEN_CPUS: "2"
        run: |
          if [ -z "${NEWB_ANTHROPIC_API_KEY}" ]; then
            echo "::error::secrets.NEWB_ANTHROPIC_API_KEY is not set on this repo." >&2
            exit 1
          fi
          newb . --json -vv > newb-self-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newb-self-report
          path: newb-self-report.json
          if-no-files-found: warn

      - name: Gate on report (default criteria — install/import/no-injection)
        run: newb gate newb-self-report.json

      - name: Render markdown summary into the run summary
        if: success()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, newb
          with open("newb-self-report.json") as f:
              report = json.load(f)
          print(newb.render_markdown(report))
          PY
