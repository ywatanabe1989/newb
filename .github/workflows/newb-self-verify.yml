name: Newb

# Dogfood verification — `newb .` against newb. If this is red, newb's
# own docs are not ready to ship; if green, the verification path works
# end-to-end on the simplest target there is (newb knows itself).
#
# Triggers:
#   * workflow_dispatch — manual ad-hoc.
#   * workflow_run — chained off `Publish newb-runner image`. Tag
#     pushes fire publish-image first; this workflow runs once that
#     completes successfully so it can pull the freshly-built tag.
#     Triggering on tag push directly would race the image build.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish newb-runner image"]
    types: [completed]

jobs:
  self-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only run when the upstream image-publish actually succeeded;
    # workflow_run fires on completion regardless of conclusion.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # On workflow_run, default checkout grabs the *branch* HEAD,
          # not the SHA that triggered the upstream workflow. We want
          # the tag's commit so the verification matches what was
          # actually published.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Runner image is public on ghcr.io as of 2026-05-03 — anonymous
      # `docker pull` works, no login step needed.

      - name: Install newb (this checkout, not PyPI)
        run: |
          pip install -e .
          newb --version

      - name: Resolve container image (must match this checkout's version)
        id: img
        run: |
          python -c "from newb._container_runner import _default_image; print('image=' + _default_image())" >> "$GITHUB_OUTPUT"

      - name: Run newb against newb
        # Auth: NEWB_ANTHROPIC_API_KEY covers real sk-ant-api* keys
        # bare. Anthropic rejects sk-ant-oat01-… OAuth tokens passed
        # as bare env, so for Claude Code Pro/Max OAuth we also pass
        # NEWB_CLAUDE_CODE_CREDENTIALS_JSON (full credentials.json
        # content). When set, the container runner materialises it
        # to a tempfile and bind-mounts it into the agent's HOME so
        # the SDK uses the file-based credentials_file flow. If the
        # secret is unset, the workflow falls back to bare-key auth.
        env:
          NEWB_ANTHROPIC_API_KEY: ${{ secrets.NEWB_ANTHROPIC_API_KEY }}
          NEWB_CLAUDE_CODE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
          # Resource caps — auditor flagged that cap-drop=ALL handles
          # capabilities but unconstrained memory/pids opens a DoS lane
          # if an attacker hijacks the agent. Generous-but-bounded is
          # the right shape for a docs verifier: pip wheel-building is
          # the peak workload, ~1-2GB transient.
          NEWB_HARDEN_MEMORY: 4g
          NEWB_HARDEN_PIDS_LIMIT: 512
          NEWB_HARDEN_CPUS: "2"
        run: |
          if [ -z "${NEWB_ANTHROPIC_API_KEY}" ]; then
            echo "::error::secrets.NEWB_ANTHROPIC_API_KEY is not set on this repo." >&2
            exit 1
          fi
          newb . --json -vv > newb-self-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newb-self-report
          path: newb-self-report.json
          if-no-files-found: warn

      - name: Gate on report (default criteria — install/import/no-injection)
        run: newb gate newb-self-report.json

      - name: Render markdown summary into the run summary
        if: success()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, newb
          with open("newb-self-report.json") as f:
              report = json.load(f)
          print(newb.render_markdown(report))
          PY
